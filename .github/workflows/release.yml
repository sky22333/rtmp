name: 构建与发布 (Build and Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: 编译 Windows 应用
    runs-on: windows-latest

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v7

    - name: 配置 .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: 还原依赖 (Restore)
      run: dotnet restore StreamCapturePro.csproj

    - name: 编译并发布 (Build & Publish)
      run: |
        dotnet publish StreamCapturePro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o publish

    - name: 打包发布文件 (Zip)
      working-directory: publish
      run: |
        Compress-Archive -Path StreamCapture.exe -DestinationPath ../StreamCapture-win-x64.zip

    - name: 创建 GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v3
      with:
        files: StreamCapture-win-x64.zip
        body: |
          ### 系统要求
          - Windows 10/11 (x64)

          ### 使用说明
          
          1. 在直播软件中执行开播动作
          2. 启动程序
          3. 在“目标进程关键字”中确认或填写关键字（可多个，逗号分隔）
          4. 点击“开始获取”
          5. 获取后可复制 Server/Key 或一键同步 OBS

        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        name: StreamCapture ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
